<div class="chat-assist-container">
  <!-- Floating Chat Button -->
  <button
    (click)="toggleChat()"
    *ngIf="!isOpen"
    class="chat-toggle-btn"
    [class.has-notifications]="newMessageCount > 0"
    aria-label="Open AI Chat Assistant"
    type="button">
    
    <div class="chat-toggle-content">
      <svg class="chat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
              d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z">
        </path>
      </svg>
      
      <div class="notification-badge" *ngIf="newMessageCount > 0">
        {{ newMessageCount }}
      </div>
      
      <div class="pulse-ring"></div>
    </div>
  </button>

  <!-- Chat Window -->
  <div
    *ngIf="isOpen"
    class="chat-window"
    [class.minimized]="isMinimized"
    [class.typing]="isTyping">
    
    <!-- Header -->
    <div class="chat-header">
      <div class="header-content">
        <div class="agent-info">
          <div class="agent-avatar">
            <div class="avatar-gradient">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
                </path>
              </svg>
            </div>
            <div class="status-indicator" [class.online]="true"></div>
          </div>
          
          <div class="agent-details">
            <h3 class="agent-name">AutoAI Assistant</h3>
            <p class="agent-status">
              <span *ngIf="isTyping" class="typing-indicator">
                <span class="typing-dot"></span>
                <span class="typing-dot"></span>
                <span class="typing-dot"></span>
                Typing...
              </span>
              <span *ngIf="!isTyping">Online • Ready to help</span>
            </p>
          </div>
        </div>

        <div class="header-actions">
          <button
            (click)="minimizeChat()"
            *ngIf="!isMinimized"
            class="header-btn minimize-btn"
            aria-label="Minimize chat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path>
            </svg>
          </button>
          
          <button
            (click)="maximizeChat()"
            *ngIf="isMinimized"
            class="header-btn maximize-btn"
            aria-label="Maximize chat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path>
            </svg>
          </button>
          
          <button
            (click)="clearChat()"
            class="header-btn clear-btn"
            aria-label="Clear conversation">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
            </svg>
          </button>
          
          <button
            (click)="closeChat()"
            class="header-btn close-btn"
            aria-label="Close chat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Messages Area -->
    <div 
      *ngIf="!isMinimized"
      class="messages-container"
      #messagesContainer>
      
      <div class="messages-content">
        <!-- Welcome Message -->
        <div class="welcome-section" *ngIf="messages.length <= 1">
          <div class="welcome-card">
            <h3 class="welcome-title">🚗 Auto Expert AI</h3>
            <p class="welcome-text">I can help you with car maintenance, troubleshooting, buying advice, and more!</p>
          </div>
        </div>

        <!-- Quick Suggestions -->
        <div class="suggestions-section" *ngIf="messages.length <= 1">
          <div class="suggestions-grid">
            <button
              *ngFor="let suggestion of quickSuggestions; trackBy: trackBySuggestionId"
              (click)="sendSuggestion(suggestion)"
              class="suggestion-chip">
              <span class="suggestion-icon">{{ suggestion.icon }}</span>
              <span class="suggestion-text">{{ suggestion.text }}</span>
            </button>
          </div>
        </div>

        <!-- Messages -->
        <div class="messages-list">
          <div
            *ngFor="let message of messages; trackBy: trackByMessageId"
            class="message-bubble"
            [class.user-message]="message.sender === 'user'"
            [class.bot-message]="message.sender === 'bot'"
            [class.sending]="message.status === 'sending'">
            
            <div class="message-content">
              <p class="message-text">{{ message.content }}</p>
              <div class="message-meta">
                <span class="message-time">
                  {{ message.timestamp | date:'HH:mm' }}
                </span>
                <span class="message-status" *ngIf="message.sender === 'user'">
                  <span *ngIf="message.status === 'sending'" class="sending-indicator">⏳</span>
                  <span *ngIf="message.status === 'sent'" class="sent-indicator">✓</span>
                </span>
              </div>
            </div>
          </div>

          <!-- Typing Indicator -->
          <div *ngIf="isTyping" class="typing-indicator-bubble">
            <div class="typing-content">
              <div class="typing-dots">
                <span></span>
                <span></span>
                <span></span>
              </div>
              <p class="typing-text">AutoAI is thinking...</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Input Area -->
    <div *ngIf="!isMinimized" class="input-section">
      <!-- Quick Actions -->
      <div class="quick-actions">
        <button class="quick-action-btn" aria-label="Attach file">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                  d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13">
            </path>
          </svg>
        </button>
        
        <button class="quick-action-btn" aria-label="Send location">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                  d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z">
            </path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                  d="M15 11a3 3 0 11-6 0 3 3 0 016 0z">
            </path>
          </svg>
        </button>
      </div>

      <!-- Message Input -->
      <div class="input-container">
        <input
          #messageInput
          type="text"
          [(ngModel)]="message"
          (keyup.enter)="sendMessage()"
          placeholder="Ask me anything about cars..."
          class="message-input"
          aria-label="Type your message">
        
        <button
          (click)="sendMessage()"
          [disabled]="!message.trim()"
          class="send-button"
          [class.enabled]="message.trim()"
          aria-label="Send message">
          
          <svg class="send-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                  d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8">
            </path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Minimized State -->
    <div *ngIf="isMinimized" class="minimized-state">
      <div class="minimized-content">
        <span class="minimized-text">AutoAI Assistant</span>
        <div class="minimized-actions">
          <button
            (click)="maximizeChat()"
            class="minimized-btn"
            aria-label="Maximize chat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
