<div class="splash-screen" [class.hidden]="!isLoading" [attr.data-theme]="currentTheme" [attr.dir]="currentLanguage === 'ar' ? 'rtl' : 'ltr'">
  <div class="splash-content">
    <!-- Logo/Brand -->
    <div class="brand-container">
      <div class="logo-wrapper">
        <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="45" fill="var(--primary-color)" opacity="0.1"/>
          <circle cx="50" cy="50" r="30" fill="var(--primary-color)" opacity="0.2"/>
          <path d="M25 50 L45 30 L65 50 L45 70 Z" fill="var(--primary-color)"/>
          <circle cx="45" cy="45" r="8" fill="white"/>
        </svg>
      </div>
      <h1 class="app-name">{{ appName }}</h1>
      <p class="tagline">{{ getTagline() }}</p>
    </div>

    <!-- Loading Animation -->
    <div class="loading-container">
      <div class="loading-icon">
        <span class="lordicon-container" lordicon lordiconIcon="loading" [lordiconSize]="48" lordiconTrigger="loop"></span>
      </div>
      <p class="loading-text">{{ getLoadingText() }}</p>
    </div>

    <!-- Progress Bar -->
    <div class="progress-container">
      <div class="progress-bar">
        <div class="progress-fill" [style.width.%]="getProgress()"></div>
      </div>
    </div>
  </div>

  <!-- Background Elements -->
  <div class="background-elements">
    <div class="floating-shape shape-1"></div>
    <div class="floating-shape shape-2"></div>
    <div class="floating-shape shape-3"></div>
  </div>
</div>
