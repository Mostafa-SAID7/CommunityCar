<footer class="bg-gray-900 text-white border-t border-primary/20">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
      <!-- Brand Section -->
      <div class="col-span-1 md:col-span-2">
        <div class="flex items-center space-x-2 mb-4">
          <img
            [src]="brand?.logo?.light"
            alt="{{brand?.name}} Logo"
            class="h-8 w-auto"
            onerror="this.style.display='none'"
          />
          <span class="text-2xl font-bold text-primary">{{brand?.name}}</span>
        </div>
        <p class="text-gray-300 mb-4">
          {{brand?.description}}
        </p>
        <div class="flex space-x-4">
          <a
            [href]="socialLinks?.facebook"
            target="_blank"
            rel="noopener noreferrer"
            class="text-gray-400 hover:text-primary transition-colors"
            aria-label="Follow us on Facebook"

            rel="noopener noreferrer"
            class="text-gray-400 hover:text-primary transition-colors"

      <!-- Quick Links -->
      <div>
        <h3 class="text-lg font-semibold mb-4 text-primary">Quick Links</h3>
        <ul class="space-y-2">
          <li><a href="/community" class="text-gray-300 hover:text-primary transition-colors">Community Forum</a></li>
          <li><a href="/services" class="text-gray-300 hover:text-primary transition-colors">Service Marketplace</a></li>
          <li><a href="/content" class="text-gray-300 hover:text-primary transition-colors">Knowledge Base</a></li>
          <li><a href="/ai-assistant" class="text-gray-300 hover:text-primary transition-colors">AI Assistant</a></li>
        </ul>
      </div>

      <!-- Support -->
      <div>
        <h3 class="text-lg font-semibold mb-4 text-primary">Support</h3>
        <ul class="space-y-2">
          <li><a href="/help" class="text-gray-300 hover:text-primary transition-colors">Help Center</a></li>
          <li><a href="/contact" class="text-gray-300 hover:text-primary transition-colors">Contact Us</a></li>
          <li><a href="/privacy" class="text-gray-300 hover:text-primary transition-colors">Privacy Policy</a></li>
          <li><a href="/terms" class="text-gray-300 hover:text-primary transition-colors">Terms of Service</a></li>
        </ul>
      </div>

    <!-- Bottom Bar -->
    <div class="border-t border-gray-700 mt-8 pt-8 flex flex-col md:flex-row justify-between items-center">
      <p class="text-gray-400 text-sm">
        © 2025 CommunityCar. All rights reserved.
      </p>
      <p class="text-gray-400 text-sm mt-2 md:mt-0">
        Made with <span class="text-primary">❤️</span> for smarter shared mobility
      </p>
