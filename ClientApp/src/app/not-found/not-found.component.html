<div class="not-found-container">
  <div class="not-found-content">
    <!-- Animated 404 -->
    <div class="error-code-wrapper">
      <h1 class="error-code" aria-label="404 Error">
        <span class="digit" data-digit="4">4</span>
        <span class="digit zero" data-digit="0">0</span>
        <span class="digit" data-digit="4">4</span>
      </h1>
      <div class="floating-elements">
        <div class="floating-circle circle-1"></div>
        <div class="floating-circle circle-2"></div>
        <div class="floating-circle circle-3"></div>
      </div>
    </div>

    <!-- Content -->
    <div class="content-wrapper">
      <h2 class="error-title">Oops! Page Not Found</h2>
      <p class="error-message">
        The page you're looking for seems to have taken a detour.
        Don't worry, let's get you back on track!
      </p>

      <!-- Action Buttons -->
      <div class="action-buttons">
        <a routerLink="/" class="btn-primary" aria-label="Go to home page">
          <svg class="btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
          </svg>
          Go Home
        </a>
        <button class="btn-secondary" (click)="goBack()" aria-label="Go back to previous page">
          <svg class="btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
          </svg>
          Go Back
        </button>
      </div>

      <!-- Search Suggestion -->
      <div class="search-suggestion">
        <p class="search-text">Or try searching for what you need:</p>
        <div class="search-box">
          <input
            type="text"
            placeholder="Search..."
            class="search-input"
            (keyup)="onSearchKeyup($event)"
            #searchInput
          >
          <button class="search-btn" (click)="search(searchInput.value)" aria-label="Search">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Decorative Elements -->
    <div class="decorative-elements">
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      <div class="shape shape-3"></div>
    </div>
  </div>
</div>
