<div class="flex min-h-screen items-center justify-center bg-slate-50 dark:bg-slate-900 px-4 py-16 transition-colors duration-300 overflow-hidden relative">
  
  <!-- Decorative blobs -->
  <div class="absolute top-1/4 left-1/4 w-64 h-64 bg-primary-400/10 dark:bg-primary-500/10 rounded-full blur-3xl animate-pulse pointer-events-none"></div>
  <div class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-blue-400/10 dark:bg-blue-500/10 rounded-full blur-3xl animate-pulse pointer-events-none" style="animation-delay: 1s;"></div>

  <div class="relative z-10 text-center max-w-lg w-full animate-slide-in">
    
    <!-- 404 Number -->
    <div class="select-none mb-4">
      <span class="text-[10rem] leading-none font-extrabold tracking-tighter bg-gradient-to-br from-primary-500 to-blue-600 bg-clip-text text-transparent drop-shadow-lg" aria-label="404 Error">
        404
      </span>
    </div>

    <!-- Icon -->
    <div class="flex justify-center mb-6">
      <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-primary-100 to-blue-100 dark:from-primary-900/40 dark:to-blue-900/40 flex items-center justify-center shadow-lg border border-primary-200 dark:border-primary-800/50">
        <svg class="w-10 h-10 text-primary-500 dark:text-primary-400" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </div>
    </div>

    <h1 class="text-2xl md:text-3xl font-extrabold text-slate-900 dark:text-white mb-3">Oops! Page Not Found</h1>
    <p class="text-slate-500 dark:text-slate-400 text-base mb-10 leading-relaxed">
      The page you're looking for seems to have taken a detour.<br>Don't worry, let's get you back on track!
    </p>

    <!-- Action Buttons -->
    <div class="flex flex-col sm:flex-row items-center justify-center gap-4 mb-10">
      <a routerLink="/" aria-label="Go to home page"
        class="inline-flex items-center gap-2 px-6 py-3 bg-primary-600 hover:bg-primary-700 text-white font-bold rounded-xl shadow-lg shadow-primary-500/20 transition-all hover:scale-105 focus-ring w-full sm:w-auto justify-center">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        Go Home
      </a>
      <button (click)="goBack()" aria-label="Go back to previous page"
        class="inline-flex items-center gap-2 px-6 py-3 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-bold rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors focus-ring w-full sm:w-auto justify-center">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        Go Back
      </button>
    </div>

    <!-- Search -->
    <div class="max-w-sm mx-auto">
      <p class="text-sm font-semibold text-slate-500 dark:text-slate-400 mb-3">Or search for what you need:</p>
      <div class="flex gap-2">
        <div class="relative flex-1">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          </div>
          <input type="text" placeholder="Search..." #searchInput (keyup)="onSearchKeyup($event)"
            class="w-full pl-9 pr-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm focus-ring text-slate-900 dark:text-white transition-colors shadow-sm" />
        </div>
        <button (click)="search(searchInput.value)" aria-label="Search"
          class="px-4 py-2.5 bg-primary-600 hover:bg-primary-700 text-white rounded-xl shadow-sm transition-colors focus-ring">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </button>
      </div>
    </div>

  </div>
</div>
