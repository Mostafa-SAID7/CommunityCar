<!-- Splash screen during initial app loading -->
<app-splash-screen *ngIf="isLoading() && !showSkeletonFirst()"></app-splash-screen>

<!-- Skeleton-first rendering for perceived performance -->
<app-page-skeleton-loader *ngIf="showSkeletonFirst()"></app-page-skeleton-loader>

<!-- Main application layout after loading -->
<div *ngIf="!isLoading() && !showSkeletonFirst()" class="min-h-screen flex flex-col bg-white dark:bg-gray-900 text-gray-900 dark:text-white transition-colors duration-300" role="application" aria-label="Community Car Application">
  <!-- Header component for navigation -->
  <app-header class="flex-shrink-0"></app-header>

  <!-- Main content area with router outlet -->
  <main class="flex-1 p-4 md:p-8 relative min-h-[calc(100vh-120px)] md:min-h-[calc(100vh-140px)]" role="main">
    <!-- Navigation error message -->
    <div *ngIf="navigationError()" class="mb-4 p-4 bg-red-100 dark:bg-red-900 border border-red-400 text-red-700 dark:text-red-200 rounded-lg" role="alert">
      {{ navigationError() }}
    </div>

    <!-- Navigation loading indicator -->
    <div *ngIf="isNavigating()" class="flex items-center justify-center min-h-[200px] bg-white dark:bg-gray-800 rounded-lg shadow-lg" aria-live="polite" aria-label="Loading page content">
      <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500"></div>
      <p class="ml-3 text-lg font-medium">Loading...</p>
    </div>

    <!-- Router outlet for dynamic content -->
    <router-outlet></router-outlet>
  </main>

  <!-- Footer component -->
  <app-footer class="flex-shrink-0"></app-footer>

  <!-- Global UI components -->
  <app-notification-container></app-notification-container>
  <app-scroll-top></app-scroll-top>
  <app-chat-assist></app-chat-assist>
</div>
