<div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden hover:shadow-md transition-shadow group cursor-pointer h-full flex flex-col" *ngIf="group">
  <div class="h-2 w-full bg-gradient-to-r from-primary-500 to-blue-500"></div>
  <div class="p-5 flex flex-col flex-1">
    <div class="flex items-center gap-3 mb-3">
      <div class="w-10 h-10 rounded-xl bg-primary-100 dark:bg-primary-900/30 flex items-center justify-center text-primary-600 dark:text-primary-400 shadow-sm">
        <ng-icon name="heroUserGroup" class="w-5 h-5"></ng-icon>
      </div>
      <div>
        <h3 class="font-bold text-slate-900 dark:text-white group-hover:text-primary-600 dark:group-hover:text-primary-400 transition-colors">{{ group?.name }}</h3>
        <span class="text-xs text-slate-500 dark:text-slate-400 font-medium">{{ group?.memberCount ?? 0 }} members</span>
      </div>
    </div>
    <p class="text-sm text-slate-600 dark:text-slate-400 line-clamp-2 mb-4 flex-1">{{ group?.description }}</p>
    <button class="w-full py-2 text-xs font-bold text-primary-600 dark:text-primary-400 border border-primary-200 dark:border-primary-800 rounded-lg hover:bg-primary-50 dark:hover:bg-primary-900/20 transition-colors focus-ring">
      Join Group
    </button>
  </div>
</div>
