<div class="bg-white dark:bg-slate-800 rounded-2xl p-5 sm:p-6 border border-slate-200 dark:border-slate-700 shadow-sm hover:shadow-md transition-shadow group cursor-pointer h-full flex flex-col">
  
  <div class="flex items-start justify-between gap-4">
    <!-- Main Content -->
    <div class="flex-1 min-w-0">
      <div class="flex items-center gap-2 mb-2">
        <span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300">
          {{ post.category }}
        </span>
        <span class="text-xs text-slate-500 dark:text-slate-400">
          • Posted by <span class="font-semibold text-slate-700 dark:text-slate-300">{{ post.author }}</span>
        </span>
      </div>
      
      <h3 class="text-xl font-bold text-slate-900 dark:text-white mb-2 group-hover:text-primary-600 dark:group-hover:text-primary-400 transition-colors line-clamp-2">
        {{ post.title }}
      </h3>
      
      <p class="text-sm text-slate-600 dark:text-slate-400 mb-4 line-clamp-2">
        {{ post.excerpt }}
      </p>
      
      <div class="flex flex-wrap gap-2 mb-4">
        <span *ngFor="let tag of post.tags" class="inline-flex items-center text-xs font-medium text-slate-500 dark:text-slate-400 hover:text-primary-600 dark:hover:text-primary-400">
          #{{ tag }}
        </span>
      </div>
    </div>
    
    <!-- Stats Column (Desktop) -->
    <div class="hidden sm:flex flex-col items-center gap-3 w-16 flex-shrink-0">
      <div class="flex flex-col items-center p-2 rounded-lg bg-green-50 dark:bg-green-900/20 text-green-700 dark:text-green-400 w-full border border-green-100 dark:border-green-900/50">
        <svg class="w-5 h-5 mb-1" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/></svg>
        <span class="text-sm font-bold">{{ post.upvotes }}</span>
      </div>
      <div class="flex flex-col items-center p-2 text-slate-500 dark:text-slate-400 w-full">
        <svg class="w-5 h-5 mb-1" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
        <span class="text-xs font-bold">{{ post.answersCount }}</span>
      </div>
    </div>
  </div>

  <!-- Mobile Stats & Footer -->
  <div class="mt-auto pt-4 border-t border-slate-100 dark:border-slate-700/50 flex items-center justify-between">
    <div class="flex sm:hidden items-center gap-4 text-sm font-semibold">
      <div class="flex items-center gap-1 text-green-600 dark:text-green-400">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/></svg>
        {{ post.upvotes }}
      </div>
      <div class="flex items-center gap-1 text-slate-500 dark:text-slate-400">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
        {{ post.answersCount }}
      </div>
    </div>
    
    <div class="text-xs font-medium text-slate-400 dark:text-slate-500 sm:ml-auto">
      {{ post.createdAt | date:'mediumDate' }}
    </div>
  </div>
</div>
