<div class="flex gap-4 p-4 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm transition-colors hover:bg-slate-50 dark:hover:bg-slate-700/30" *ngIf="answer">
  <!-- Votes -->
  <div class="flex flex-col items-center gap-1 flex-shrink-0">
    <button class="p-1 rounded-full text-slate-400 hover:text-primary-600 hover:bg-primary-50 dark:hover:bg-primary-900/20 transition-colors focus-ring" aria-label="Upvote">
      <ng-icon name="heroChevronUp" class="w-5 h-5"></ng-icon>
    </button>
    <span class="text-sm font-bold text-slate-700 dark:text-slate-300">{{ answer?.votes ?? 0 }}</span>
    <button class="p-1 rounded-full text-slate-400 hover:text-orange-500 hover:bg-orange-50 dark:hover:bg-orange-900/20 transition-colors focus-ring" aria-label="Downvote">
      <ng-icon name="heroChevronDown" class="w-5 h-5"></ng-icon>
    </button>
  </div>
  <!-- Content -->
  <div class="flex-1 min-w-0">
    <p class="text-sm text-slate-700 dark:text-slate-300 leading-relaxed mb-3">{{ answer?.content }}</p>
    <span class="text-xs font-semibold text-slate-400 dark:text-slate-500">By {{ answer?.author }}</span>
  </div>
</div>
