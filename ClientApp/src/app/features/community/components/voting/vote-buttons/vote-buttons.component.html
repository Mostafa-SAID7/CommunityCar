<div class="flex flex-col items-center gap-1">

    <ng-icon name="heroChevronUp" class="w-6 h-6"></ng-icon>
  </button>
  <span class="text-sm font-bold text-slate-700 dark:text-slate-300 min-w-[1.5rem] text-center">0</span>
  <button class="p-2 rounded-full text-slate-400 hover:text-orange-500 hover:bg-orange-50 dark:hover:bg-orange-900/20 dark:hover:text-orange-400 transition-colors focus-ring" aria-label="Downvote">
    <ng-icon name="heroChevronDown" class="w-6 h-6"></ng-icon>
