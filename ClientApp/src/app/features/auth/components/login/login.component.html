<div class="flex min-h-screen items-center justify-center bg-[var(--background-color)]">
  <form class="w-full max-w-sm p-8 rounded-xl shadow-lg bg-white/80 backdrop-blur-lg border border-[var(--border-color)]" autocomplete="off" aria-label="Login form">
    <h2 class="text-2xl font-bold mb-6 text-[var(--primary-color)] font-heading">Sign In</h2>
    <div class="mb-4">
      <label for="email" class="block text-sm font-medium text-[var(--body-text-color)] mb-1">Email</label>
      <input id="email" name="email" type="email" required class="w-full px-4 py-2 rounded-lg border border-[var(--border-color)] focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] bg-white text-[var(--body-text-color)] transition duration-150" placeholder="Enter your email" />
    </div>
    <div class="mb-6">
      <label for="password" class="block text-sm font-medium text-[var(--body-text-color)] mb-1">Password</label>
      <input id="password" name="password" type="password" required class="w-full px-4 py-2 rounded-lg border border-[var(--border-color)] focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] bg-white text-[var(--body-text-color)] transition duration-150" placeholder="Enter your password" />
    </div>
    <button type="submit" class="w-full py-2 rounded-lg font-semibold text-white bg-gradient-to-r from-[var(--primary-color)] to-[var(--accent-color)] shadow-md hover:scale-[1.03] transition-transform duration-150 focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)]">Login</button>
    <div class="mt-4 text-center">
      <a href="#" class="text-sm text-[var(--primary-color)] hover:underline">Forgot password?</a>
    </div>
  </form>
</div>
