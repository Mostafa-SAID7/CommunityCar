<div class="flex min-h-screen items-center justify-center bg-[var(--background-color)]">
  <form class="w-full max-w-sm p-8 rounded-xl shadow-lg bg-white/80 backdrop-blur-lg border border-[var(--border-color)]" autocomplete="off" aria-label="Reset password form" (ngSubmit)="submit()">
    <h2 class="text-2xl font-bold mb-6 text-[var(--primary-color)] font-heading">Reset Password</h2>
    <div class="mb-4">
      <label for="password" class="block text-sm font-medium text-[var(--body-text-color)] mb-1">New Password</label>
      <input id="password" name="password" type="password" [(ngModel)]="password" required minlength="6" class="w-full px-4 py-2 rounded-lg border border-[var(--border-color)] focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] bg-white text-[var(--body-text-color)] transition duration-150" placeholder="Enter new password" />
    </div>
    <div class="mb-6">
      <label for="confirm" class="block text-sm font-medium text-[var(--body-text-color)] mb-1">Confirm Password</label>
      <input id="confirm" name="confirm" type="password" [(ngModel)]="confirm" required minlength="6" class="w-full px-4 py-2 rounded-lg border border-[var(--border-color)] focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] bg-white text-[var(--body-text-color)] transition duration-150" placeholder="Repeat new password" />
    </div>
    <button type="submit" class="w-full py-2 rounded-lg font-semibold text-white bg-gradient-to-r from-[var(--primary-color)] to-[var(--accent-color)] shadow-md hover:scale-[1.03] transition-transform duration-150 focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)]" [disabled]="submitted">Reset Password</button>
    <div *ngIf="error" class="mt-4 text-center text-sm text-red-600">{{ error }}</div>
    <div *ngIf="submitted && !error" class="mt-4 text-center text-sm text-green-600">Processing...</div>
  </form>
</div>
