<div class="flex min-h-[calc(100vh-4rem)] items-center justify-center bg-slate-50 dark:bg-slate-900 p-4 transition-colors duration-300">
  <div class="w-full max-w-md animate-slide-in">
    <!-- Brand Context -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-primary-500 to-primary-700 text-white shadow-lg shadow-primary-500/30 mb-4">
        <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
      </div>
      <h2 class="text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight">Forgot Password</h2>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-2">Enter your email and we'll send a reset link.</p>
    </div>

    <!-- Forgot Password Form -->
    <form class="p-8 rounded-2xl shadow-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700" autocomplete="off" aria-label="Forgot password form" (ngSubmit)="submit()">
      
      <div class="space-y-5">
        <div>
          <label for="email" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">Email Address</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
            </div>
            <input id="email" name="email" type="email" [(ngModel)]="email" required 
              class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 focus-ring bg-slate-50 dark:bg-slate-900/50 text-slate-900 dark:text-white transition-colors" 
              placeholder="you@example.com" />
          </div>
        </div>
      </div>

      <div class="mt-8">
        <button type="submit" class="w-full flex justify-center items-center gap-2 py-3 px-4 border border-transparent rounded-xl shadow-sm shadow-primary-500/20 text-sm font-bold text-white bg-primary-600 hover:bg-primary-700 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100 focus-ring transition-all hover:scale-[1.02]" [disabled]="submitted">
          <span *ngIf="!submitted">Send Reset Link</span>
          <ng-container *ngIf="submitted">
            <svg class="w-5 h-5 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            <span>Sending...</span>
          </ng-container>
        </button>
      </div>

      <!-- Messages -->
      <div *ngIf="error" class="mt-6 p-4 rounded-xl bg-red-50 dark:bg-red-900/20 border border-red-100 dark:border-red-900/50 flex gap-3 text-red-600 dark:text-red-400 text-sm font-medium">
        <svg class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span>{{ error }}</span>
      </div>
      
      <div *ngIf="submitted && !error" class="mt-6 p-4 rounded-xl bg-green-50 dark:bg-green-900/20 border border-green-100 dark:border-green-900/50 flex gap-3 text-green-600 dark:text-green-400 text-sm font-medium">
        <svg class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span>If an account with that email exists, we've sent instructions to reset your password.</span>
      </div>

    </form>
    
    <p class="text-center text-sm text-slate-500 dark:text-slate-400 mt-8">
      Remember your password? 
      <a routerLink="/auth/login" class="font-bold text-primary-600 hover:text-primary-700 dark:text-primary-400 dark:hover:text-primary-300 transition-colors">Sign in</a>
    </p>
  </div>
</div>
