<div class="flex min-h-screen items-center justify-center bg-[var(--background-color)]">
  <form class="w-full max-w-sm p-8 rounded-xl shadow-lg bg-white/80 backdrop-blur-lg border border-[var(--border-color)]" autocomplete="off" aria-label="Forgot password form" (ngSubmit)="submit()">
    <h2 class="text-2xl font-bold mb-6 text-[var(--primary-color)] font-heading">Forgot Password</h2>
    <div class="mb-4">
      <label for="email" class="block text-sm font-medium text-[var(--body-text-color)] mb-1">Email</label>
      <input id="email" name="email" type="email" [(ngModel)]="email" required class="w-full px-4 py-2 rounded-lg border border-[var(--border-color)] focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] bg-white text-[var(--body-text-color)] transition duration-150" placeholder="Enter your email" />
    </div>
    <button type="submit" class="w-full py-2 rounded-lg font-semibold text-white bg-gradient-to-r from-[var(--primary-color)] to-[var(--accent-color)] shadow-md hover:scale-[1.03] transition-transform duration-150 focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)]" [disabled]="submitted">Send Reset Link</button>
    <div *ngIf="error" class="mt-4 text-center text-sm text-red-600">{{ error }}</div>
    <div *ngIf="submitted && !error" class="mt-4 text-center text-sm text-green-600">Sending...</div>
  </form>
</div>
